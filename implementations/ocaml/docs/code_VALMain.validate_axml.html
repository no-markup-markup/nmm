<code class="code"><span class="keyword">let</span> validate_axml (axml : <span class="constructor">Xml</span>.xml) : unit =
  <span class="keyword">try</span>
    <span class="keyword">let</span> _ = <span class="constructor">Dtd</span>.prove (axml_dtd_checked ()) <span class="string">"cr_doc"</span> axml <span class="keyword">in</span>
    ()
  <span class="keyword">with</span> <span class="constructor">Dtd</span>.<span class="constructor">Prove_error</span> e <span class="keywordsign">-&gt;</span>
    raise
      (<span class="constructor">Error</span>
         (<span class="constructor">String</span>.concat <span class="string">" "</span>
            [ <span class="string">"axml Ddt.prove_error:"</span>; <span class="constructor">Dtd</span>.prove_error e ]))</code></body></html>
