<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>untitled</title>

<style>
html {
    --title_indent    : 0.0rem;
    --author_indent   : 0.0rem;
    --abstract_indent : 0.0rem;
    --refs_indent     : 0.0rem;
    --left_margin     : 0.0rem;
    --tab_length      : 6ch;
    font-family       : monospace;
    font-size         : medium;
    line-height       : 150%;

}


.title {
    font-weight : normal;
    font-size   : large;
    margin-left : var(--title_indent);
}

.doc.chs .title {
    font-size   : xx-large;
    margin-left : 0;
}


.doc.secs .title {
    font-size : x-large;
}


.authors {
    margin-bottom : 3rem;
    margin-left   : var(--author_indent);
}


.doc.chs .authors {
    font-size   : large;
    margin-left : 0;
}


.doc.secs .author {
    font-size : large;
}


.abstract {
    margin-bottom : 3rem;
    margin-left   : var(--abstract_indent);
}

.doc.chs .abstract {
    margin-left : 0;
}


.abstract_hdr {
    font-weight : normal;
    font-size   : large;
}


.doc.blks .abstract_hdr {
    margin-bottom : 0.5rem;
}


.refs {
    padding-top : 2rem;
    margin-left : var(--refs_indent);
}


.doc.chs .refs {
    border-top  : thin solid gray;
    margin-left : 0;
}


.doc.blks .refs_hdr {
    margin-bottom : 1rem;
}


.refs_hdr {
    font-weight : normal;
    font-size   : large;
}


.doc.chs .refs_hdr {
    font-size : x-large;
}


.ch {
    padding-top    : 3rem;
    padding-bottom : 3rem;
    border-top     : thin solid gray;
}


.ch_lbl {
    font-weight : normal;
    font-size   : x-large;
}


.ch_hdr {
    font-size : x-large;
}


.ch_hdr, .ch_lbl.hdr {
    margin-top    : 0;
    margin-bottom : 3rem;
}

.ch_lbl + .ch_hdr {
    margin-top : 1rem;
}


.sec + .sec {
    padding-top : 3rem;
}


.sec_lbl {
    font-size   : large;
    font-weight : normal;
}


.sec_hdr {
    margin-left : var(--left_margin);
    font-size   : large;
}


.par + .par {
    padding-top : 2rem;
}

.par_lbl {
    font-weight : normal;
}

.par_tag {
    font-weight : bold;
    margin-right : 1ch;
}

.par_hdr {
    margin-right : 2ch;
}

.par_tag .par_hdr {
    margin-right : 0;
}

.par_tag + .par_hdr::before {
    content : " (";
}

.par_tag + .par_hdr::after {
    content      : ")";
    margin-right : 2ch;
}

.par_main {
    margin-left : var(--left_margin);
}


.blk + .blk {
    padding-top : 1rem;
}


.blk.txt {
    hyphens     : auto;
    white-space : pre-wrap;
}


.vrb_line {
    min-height    : 1rem;
    margin-top    : 0;
    margin-bottom : 0;
}


.sec_main > .blk {
    margin-left : var(--left_margin);
}


.blk_blt_main {
    margin-left : var(--tab_length);
}


.blk_itm_main {
    margin-left : var(--tab_length);
}


.dsp_line_main {
    margin-left : var(--tab_length);
}


a {
    text-decoration : none;
}


@media print {

  html {
    font-size : 13px;
  }


  .ch_hdr, .ch_lbl, .sec_hdr, .sec_lbl, .par_lbl, .par_hdr, .par_tag, .abstract_hdr, .refs_hdr, .blk_itm_lbl, .blk_blt_lbl {
    break-after  : avoid-page;
    break-inside : avoid-page;
  }


  .ch_main, .sec_main, .par_main, .blk_itm_main, .blk_blt_main {
    break-before : avoid-page;
  }


  .blk.dsp {
    break-inside : avoid-page;
  }


  .ch {
    break-before : page;
    border       : none;
  }


  .doc.chs .refs {
    break-before : page;
    border       : none;
  }


  @page {
    size          : a4;
    margin-top    : 20mm;
    margin-left   : 20mm;
    margin-right  : 20mm;
    margin-bottom : 30mm;

    @top-center {
       content : " ";
    }

    @bottom-center {
      padding : 10mm;
      content : counter(page) " of " counter(pages);
    }
  }
}
</style>
</head>
<body>
<div style="display:block" class="doc blks">
<div class="doc_main" style="display:block">
<p class="blk txt" style="margin-top:0;margin-bottom:0;">Hello</p>
<p class="blk txt" style="margin-top:0;margin-bottom:0;">World</p>
</div>
</div>
</body>
</html>
