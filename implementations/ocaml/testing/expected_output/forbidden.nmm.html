<html lang="en">
<head>
<style>
html {
        --font_family:monospace;
        --font_size:12px;
        --title_indent:0ch;
        --author_indent:0ch;
        --left_margin:12ch;
        --tab_length:6ch;
        font-family:var(--font_family);
        font-size:var(--font-size);
}

div.doc {
        display:block;
}


h1.title {
        display:block;
        font-size:var(--font-size);
        margin-left:var(--title_indent);
}


p.author {
        display:block;
        margin-left:var(--author_indent);
}


div.doc_main {
        display:block;
}


div.sec {
        display:block;
}


div.sec + div.sec {
        margin-top:3ch;
}


div.sec_lbl {
        display:block;
        float:left;
        margin-right:1ch;
}


h3.sec_hdr {
        display:block;
        font-size:var(--font-size);
        margin-left:var(--left_margin);
}


div.sec_main {
        display:block;
}


div.sec_lbl + div.sec_main::before {    /* prevents par from jumping up when left_margin is 0 */
        content:" ";
        white-space:pre;
}


div.par {
        display:block;
}


div.par + div.par {
        margin-top:2ch;
}


div.par_lbl {
        display:block;
        float:left;
        margin-right:1ch;
}


h4.par_hdr {                      /* content of par_hdr is moved inside par_main for inline display */
        visibility:hidden;
        height:0ch;
        width:0ch;
        float:left;
}


div.par_main {
        display:block;
}


p.blk_txt {
        display:block;
        hyphens:auto;
        white-space:pre-wrap;
}


div.par_main > p.blk_txt {
        margin-left:var(--left_margin);
}


div.sec_main > p.blk_txt {
        margin-left:var(--left_margin);
}


div.blk_blt {
        display:block;
}


div.par_main > div.blk_blt {
        margin-left:var(--left_margin)
}


div.sec_main > div.blk_blt {
        margin-left:var(--left_margin);
}


div.blk_blt_lbl {
        display:block;
        float:left;
        margin-right:1ch;
}


div.blk_blt_main {
        display:block;
        margin-left:var(--tab_length);
}


div.blk_itm {
        display:block;
}


div.par_main > div.blk_itm {
        margin-left:var(--left_margin);
}


div.sec_main > div.blk_itm {
        margin-left:var(--left_margin);
}


div.blk_itm_lbl {
        display:block;
        float:left;
        margin-right:1ch;
}


div.blk_itm_main {
        display:block;
        margin-left:var(--tab_length);
}


div.blk_dsp {
        display:block;
        white-space:nowrap;
}


div.par_main > div.blk_dsp {
        margin-left:var(--left_margin);
}


div.sec_main > div.blk_dsp {
        margin-left:var(--left_margin);
}


div.dsp_line {
        display:block;
}


div.dsp_line_lbl {
        display:block;
        float:left;
        margin-right:1ch;
}


div.dsp_line_main {
        display:block;
        white-space:pre;
        margin-left:var(--tab_length);
}


a {
        text-decoration:none;
}


@media print {
        .sec_hdr, .sec_lbl, .par_hdr, .par_lbl {
                page-break-after:avoid;
        }

/* For one-sided printing:*/
        @page {
                size:a4;
                margin-top:20mm;
                margin-left:20mm;
                margin-right:20mm;
                margin-bottom:30mm;

                @top-center {
                        content:" ";
                }

                @bottom-center {
                        padding:10mm;
                        content: counter(page) " of " counter(pages);
                }
        }
}
</style>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
</head>
<body>
<div class="doc">
<div class="doc_main">
<p class="blk_txt">The forbidden characters look like this: &lt; &gt; &amp; &apos; &quot;</p>
</div>
</div>
</body>
</html>
