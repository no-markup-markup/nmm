<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>untitled</title>

<style>
html {
    --title_indent    : 7.20rem;
    --author_indent   : 7.20rem;
    --abstract_indent : 7.20rem;
    --refs_indent     : 7.20rem;
    --left_margin     : 7.20rem;
    --tab_length      : 6ch;
    font-family       : monospace;
    font-size         : medium;
    line-height       : 150%;
}


a {
    text-decoration : none;
}


p, pre {
    margin-top    : 0;
    margin-bottom : 0;
}


h2, h3, h4, h5 {
    margin-top : 0;
}


h4.inline {
    margin-bottom : 0;
}


.title {
    font-weight : normal;
    font-size   : large;
    margin-left : var(--title_indent);
}


.doc.chs .title {
    font-size   : xx-large;
    margin-left : 0;
}


.doc.secs .title {
    font-size : x-large;
}


.authors {
    margin-bottom : 3rem;
    margin-left   : var(--author_indent);
}


.doc.chs .authors {
    font-size   : large;
    margin-left : 0;
}


.doc.secs .author {
    font-size : large;
}


.abstract {
    margin-bottom : 3rem;
    margin-left   : var(--abstract_indent);
}


.doc.chs .abstract {
    margin-left : 0;
}


.abstract_hdr {
    font-weight : normal;
    font-size   : large;
}


.doc.blks .abstract_hdr {
    margin-bottom : 0.5rem;
}


.refs {
    padding-top : 2rem;
    margin-left : var(--refs_indent);
}


.doc.chs .refs {
    padding-top : 3rem;
    border-top  : thin solid gray;
    margin-left : 0;
}


.doc.blks .refs_hdr {
    margin-bottom : 1rem;
}


.refs_hdr {
    font-weight : normal;
    font-size   : large;
}


.doc.chs .refs_hdr {
    font-size : x-large;
    margin-bottom : 3rem;
}


.ch {
    padding-top    : 3rem;
    padding-bottom : 3rem;
    border-top     : thin solid gray;
}


.ch_lbl {
    font-weight : normal;
    font-size   : x-large;
}


.ch_hdr {
    font-size : x-large;
}


.ch_hdr, .ch_lbl.hdr {
    margin-bottom : 3rem;
}

.ch_lbl + .ch_hdr {
    margin-top : 1rem;
}


.sec + .sec {
    margin-top : 3rem;
}


.sec_lbl {
    font-size   : large;
    font-weight : normal;
}


.sec_hdr {
    margin-left : var(--left_margin);
    font-size   : large;
}


.par + .par {
    margin-top : 2rem;
}


.par_lbl {
    font-weight : normal;
}


.par_tag {
    font-weight : bold;
    margin-right : 1ch;
}


.par_hdr, .par_tag.hdr {
    margin-right  : 2ch;
    margin-bottom : 1rem;
}


.par_tag + .par_hdr::before {
    content : " (";
}


.par_tag + .par_hdr::after {
    content : ")";
}


.par_main {
    margin-left : var(--left_margin);
}


.blk + .blk {
    margin-top : 1rem;
}


.blk.txt {
    hyphens     : auto;
    white-space : pre-wrap;
}


.vrb_line {
    min-height : 1rem;
}


.sec_main > .blk {
    margin-left : var(--left_margin);
}


.blk_blt_main {
    margin-left : var(--tab_length);
}


.blk_itm_main {
    margin-left : var(--tab_length);
}


.dsp_line_main {
    margin-left : var(--tab_length);
}

@media print {

  html {
    font-size : 13px;
  }


  h1, h2, h3, h4, h5, .ch_lbl, .sec_lbl, .par_lbl, .par_tag, .blk_itm_lbl, .blk_blt_lbl {
    break-after  : avoid-page;
    break-inside : avoid-page;
  }


  .ch_main, .sec_main, .par_main, .blk_itm_main, .blk_blt_main {
    break-before : avoid-page;
  }


  .blk.dsp {
    break-inside : avoid-page;
  }


  .ch {
    break-before : page;
    border       : none;
  }


  .doc.chs .refs {
    break-before : page;
    border       : none;
  }


  @page {
    size          : a4;
    margin-top    : 20mm;
    margin-left   : 20mm;
    margin-right  : 20mm;
    margin-bottom : 30mm;

    @top-center {
       content : " ";
    }

    @bottom-center {
      padding : 10mm;
      content : counter(page) " of " counter(pages);
    }
  }
}
</style>
</head>
<body>
<div style="display:block" class="doc pars">
<div class="doc_main" style="display:block">
<div style="display:block" class="par">
<div class="par_lbl" style="display:block;float:left">¶ 1</div>
<div class="clear"></div>
<div class="par_main" style="display:block">
<h4 class="par_hdr inline" style="float:left">Header 1</h4>
<p class="blk txt">Some text.</p>
</div>
</div>
<div style="display:block" class="DEF par">
<div class="par_lbl" style="display:block;float:left">¶ 2</div>
<div class="clear"></div>
<div class="par_main" style="display:block">

<p class="blk txt">Some text.</p>
</div>
</div>
<div style="display:block" class="DEF par">
<div class="par_lbl" style="display:block;float:left">¶ 3</div>
<div class="clear"></div>
<div class="par_main" style="display:block">
<h4 class="par_tag hdr">DEFINITION</h4>
<div class="blk blt" style="display:block">
<div class="blk_blt_lbl" style="display:block;float:left">─</div>
<div class="clear"></div>
<div class="blk_blt_main" style="display:block">
<p class="blk txt">bullet</p>
</div>
</div>
</div>
</div>
<div style="display:block" class="par">
<div class="par_lbl" style="display:block;float:left">¶ 4</div>
<div class="clear"></div>
<div class="par_main" style="display:block">
<h4 class="par_hdr">Header 2</h4>
<div class="blk blt" style="display:block">
<div class="blk_blt_lbl" style="display:block;float:left">─</div>
<div class="clear"></div>
<div class="blk_blt_main" style="display:block">
<p class="blk txt">bullet</p>
</div>
</div>
</div>
</div>
<div style="display:block" class="THM par">
<div class="par_lbl" style="display:block;float:left">¶ 5</div>
<div class="clear"></div>
<div class="par_main" style="display:block">
<div class="par_tag" style="display:block;float:left">THEOREM</div>
<h4 class="par_hdr">Header 3</h4>
<div class="blk blt" style="display:block">
<div class="blk_blt_lbl" style="display:block;float:left">─</div>
<div class="clear"></div>
<div class="blk_blt_main" style="display:block">
<p class="blk txt">bullet</p>
</div>
</div>
</div>
</div>
<div style="display:block" class="THM par">
<div class="par_lbl" style="display:block;float:left">¶ 6</div>
<div class="clear"></div>
<div class="par_main" style="display:block">
<div class="par_tag" style="display:block;float:left">THEOREM</div>
<h4 class="par_hdr inline" style="float:left">Header 4</h4>
<p class="blk txt">Some theorem.</p>
</div>
</div>
</div>
</div>
</body>
</html>
