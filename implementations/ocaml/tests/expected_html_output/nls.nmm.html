<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>untitled</title>

<style>

/*========================= default css ===========================*/

.doc {
  font-family : monospace;
  line-height : 150%;
  width       : 80ch;
  margin      : auto;
}

.txt_unit_emph {
  font-style      : normal;
  text-decoration : underline;
}

.txt_unit_c_ref, .txt_unit_nte, .blk_nte_lbl {
  text-decoration : none;
}

.txt, .vrb_line {
  margin-top    : 0;
  margin-bottom : 0;
}



/************* TITLE ********************/

.title {
  font-weight   : normal;
  font-size     : 200%;
  margin-bottom : 1rem;
  line-height   : 130%;
}

.doc.pars .title {
  margin-left : 0;
}

.doc.secs .title {
  margin-left : 0;
}

.doc.chs .title {
  font-size : 300%;
}


/************ AUTHORS *******************/

.title + .authors {
  margin-top : 1rem;
}

.authors {
  margin-bottom : 1rem;
}

.author + .author {
  margin-top : 1rem;
}

.doc.pars .authors {
  margin-left : 0;
}

.doc.secs .authors {
  margin-left : 0;
}

/************ DATE ******************/


.doc.pars .date {
  margin-left : 0;
}

.doc.secs .date {
  margin-left : 0;
}

/************ ABSTRACT ******************/

.abstract {
  margin-bottom : 3rem;
}

* + .abstract {
  margin-top : 2rem;
}

.doc.pars .abstract {
  margin-left : 0;
}

.doc.secs .abstract {
  margin-left : 0;
}

.abstract_hdr {
  margin-top    : 0;
  font-weight   : normal;
  font-size     : 120%;
  margin-bottom : 0.5rem;
}


/************* REFS *********************/

.refs {
  margin-top : 3rem;
}

.doc.pars .refs {
  margin-left : 0;
}

.doc.secs .refs {
  margin-left : 0;
}

.doc.chs .refs {
  margin-top  : 0;
  padding-top : 3rem;
  border-top  : thin solid;
}

.refs_hdr {
  margin-top  : 0;
  font-weight : normal;
  font-size   : 150%;
}

.doc.chs .refs_hdr {
  font-size     : 200%;
  margin-bottom : 3rem;
}


/************* DOC_MAIN *****************/

* + .doc_main {
  margin-top : 2rem;
}

/************** CH **********************/

.ch {
  padding-top    : 3rem;
  padding-bottom : 3rem;
  border-top     : solid;
}

.ch_lbl {
  font-weight : normal;
  font-size   : 200%;
}

.ch_hdr {
  font-size   : 200%;
  line-height : 130%;
}

.ch_hdr, .ch_lbl.hdr {
  margin-top    : 0;
  margin-bottom : 3rem;
}

.ch_lbl + .ch_hdr {
  margin-top : 1rem;
}


/************** SEC *********************/

.sec + .sec {
  margin-top : 3rem;
}

.sec_lbl {
  margin-top  : 0;
  float       : left;
  font-size   : 150%;
  font-weight : normal;
  line-height : 130%;
}

.sec_hdr {
  margin-top     : 0;
  margin-left    : 0;
  font-size      : 150%;
  line-height    : 130%;
  bookmark-label : attr(bookmark) "  " content();
}

.sec.pars > .sec_lbl.hdr {
  float : none;
}

/************** PAR *********************/

.par + .par {
  margin-top : 2rem;
}

.par_lbl {
  margin-top  : 0;
  float       : left;
  font-weight : normal;
  font-size   : inherit;
}

.par_tag, .par_hdr {
  margin-top     : 0;
  font-weight    : bold;
  display        : inline;
  font-size      : inherit;
}

.par_tag.hdr, .par_hdr {
  bookmark-label : attr(bookmark) "  " content();
}

.par_main {
  margin-left : 0;
}


/************** BLK *********************/

.par_hdr + .blk.txt {
  display     : inline;
  margin-left : 1ch;
}

.par_tag.hdr + .blk.txt {
  display     : inline;
  margin-left : 1ch;
}

* + .blk {
  margin-top : 1rem;
}

.sec_main > .blk {
  margin-left : 0;
}

.blk.txt {
  hyphens     : auto;
  white-space : pre-wrap;
}


.blk_blt_lbl {
  float : left;
}

.blk_blt_main {
  margin-left : 6ch;
}


.blk_itm_lbl {
  float : left;
}

.blk_itm_main {
  margin-left : 6ch;
}


.dsp_line_lbl {
  float : left;
}

.dsp_line_main {
  margin-left : 6ch;
  white-space : pre;
}

.blk_qtn_main {
  hyphens     : auto;
  white-space : pre-wrap;
  margin-left : 6ch;
}

/******** ENDNOTES/FOOTNOTES ************/

.doc_endnotes_hdr, .ch_endnotes_hdr, .sec_endnotes_hdr, .par_endnotes_hdr, .abstract_endnotes_hdr, .refs_endnotes_hdr {
  margin-top  : 0;
  font-weight : normal;
  font-size   : 120%;
}

.doc_endnotes, .ch_endnotes, .sec_endnotes, .par_endnotes, .abstract_endnotes, .refs_endnotes {
  margin-top  : 2rem;
  border-top  : thin solid;
  padding-top : 0.5rem;
}

.sec_endnotes, .par_endnotes {
  margin-left : 0;
}

.blk_nte_lbl {
  float : left;
}

.blk_nte_main {
  margin-left : 6ch;
}

/*************** BIB ********************/


.bib_custom .blk_itm_lbl {
  float : none;
}


/*************** PRINTING ***************/

@media print {

  html {
    font-family : monospace;
    font-size   : 12px;
  }

  .refs_hdr, .abstract_hdr, .ch_hdr, .ch_lbl, .sec_hdr, .sec_lbl, .par_hdr, .par_lbl, .par_tag, .blk_itm_lbl, .blk_blt_lbl, .clear {
    break-after  : avoid-page;
    break-inside : avoid-page;
  }


  .ch_main, .sec_main, .par_main, .blk_itm_main, .blk_blt_main {
    break-before : avoid-page;
  }


  .blk.dsp {
    break-inside : avoid-page;
  }


  .ch {
    break-before : page;
    border       : none;
  }


  .doc.chs .refs {
    break-before : page;
    border       : none;
  }


  @page {
    size          : a4;
    width         : 80ch;
    margin-left   : 20mm;
    margin-right  : 20mm;
    margin-top    : 20mm;
    margin-bottom : 30mm;

    @top-center {
       content : " ";
    }

    @bottom-center {
      padding : 10mm;
      content : counter(page) "/" counter(pages);
    }
  }
}

</style>

</head>
<body>
<div class="doc blks">
<div class="doc_main">
<p class="blk txt">A</p>
<p class="blk txt">B</p>
<div class="blk itm">
<div class="blk_itm_lbl">(a)</div>
<div class="clear"></div>
<div class="blk_itm_main">
<p class="blk txt">C</p>
<p class="blk txt">D</p>
<div class="blk itm">
<div class="blk_itm_lbl">(1)</div>
<div class="clear"></div>
<div class="blk_itm_main">
<p class="blk txt">E</p>
<p class="blk txt">F</p>
</div>
</div>
</div>
</div>
<p class="blk txt">G</p>
</div>
</div>
</body>
</html>
